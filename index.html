<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katana</title>
    <!-- Tailwind CSS (装飾用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 必須のレイアウト用CSS (Tailwindが遅れても崩れないように設定) */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #gameCanvas { z-index: 10; background: #0f172a; }
        #confettiCanvas { z-index: 150; pointer-events: none; }

        /* スタート画面 */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); z-index: 300; pointer-events: auto; }
        #title-text { font-size: clamp(60px, 15vw, 100px); font-weight: 900; font-style: italic; color: #fde047; text-shadow: 0 0 20px #dc2626; margin: 0 0 10px 0; letter-spacing: 5px; text-transform: uppercase; }
        #subtitle-text { color: #fecaca; font-size: clamp(16px, 4vw, 24px); font-weight: bold; letter-spacing: 0.4em; margin-bottom: 60px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #start-btn { padding: 20px 60px; font-size: 24px; font-weight: 900; color: white; background: linear-gradient(90deg, #dc2626, #991b1b); border: 2px solid #fca5a5; border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px rgba(220,38,38,0.6); transition: transform 0.1s, filter 0.1s; }
        #start-btn:active { transform: scale(0.95); filter: brightness(0.8); }

        /* ゲーム内UI */
        #ui { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; z-index: 50; display: none; pointer-events: none; box-sizing: border-box; }
        .ui-header { display: flex; justify-content: space-between; align-items: flex-end; color: white; }
        .label { font-size: 12px; font-weight: bold; opacity: 0.6; letter-spacing: 1px; }
        .val-text { font-size: 36px; font-weight: 900; }
        .val-level { font-style: italic; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .val-blade { color: #22d3ee; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .exp-bar { width: 100%; height: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 10px rgba(0,0,0,0.5); overflow: hidden; }
        #exp-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0ea5e9, #6366f1); transition: width 0.2s; }

        /* ジョイスティック */
        #joy-base { position: absolute; width: 90px; height: 90px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); display: none; transform: translate(-50%, -50%); pointer-events: none; z-index: 100; }
        #joy-stick { position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; background: rgba(255,255,255,0.7); border-radius: 50%; margin: -18px 0 0 -18px; box-shadow: 0 0 15px rgba(255,255,255,0.5); }

        /* ボスUI */
        #boss-ui { position: absolute; bottom: 30px; left: 10%; width: 80%; display: none; text-align: center; z-index: 50; pointer-events: none; }
        #boss-hp { width: 100%; height: 16px; background: #222; border: 2px solid #ef4444; border-radius: 8px; overflow: hidden; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        #boss-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #dc2626, #f87171); }
        
        #message-log { position: absolute; top: 90px; left: 0; width: 100%; text-align: center; font-weight: 900; font-size: 20px; color: #fbbf24; text-shadow: 0 0 15px rgba(0,0,0,0.8); pointer-events: none; z-index: 60; }
        
        /* 結果画面 */
        #screen-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 450px; display: none; background: rgba(15,23,42,0.95); padding: 35px; border-radius: 20px; border: 2px solid #3b82f6; color: white; box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 200; text-align: center; box-sizing: border-box; }
        .interactive-link { pointer-events: auto; -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; cursor: pointer; }
    </style>
</head>
<body>

<!-- スタート画面 -->
<div id="start-screen">
    <h1 id="title-text">Katana</h1>
    <p id="subtitle-text">SURVIVAL ACTION</p>
    <button id="start-btn" class="interactive-link">GAME START</button>
</div>

<!-- ゲーム内UI -->
<div id="ui">
    <div class="ui-header">
        <div><div class="label">LEVEL</div><div class="val-text val-level" id="lv-text">1</div></div>
        <div style="text-align: right;"><div class="label">ENERGY BLADES</div><div class="val-text val-blade" id="blade-text">3</div></div>
    </div>
    <div class="exp-bar"><div id="exp-fill"></div></div>
</div>

<div id="message-log"></div>

<div id="boss-ui">
    <div style="color: #ef4444; font-size: 14px; font-weight: 900; margin-bottom: 4px; letter-spacing: 2px;">WARNING: FINAL BOSS</div>
    <div id="boss-hp"><div id="boss-fill"></div></div>
</div>

<div id="joy-base"><div id="joy-stick"></div></div>

<div id="screen-msg">
    <div id="msg-content"></div>
</div>

<canvas id="gameCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>

<script>
// 確実にDOMの読み込みが完了してから初期化処理を開始する
window.addEventListener("load", function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const confettiCanvas = document.getElementById('confettiCanvas');
    const cCtx = confettiCanvas.getContext('2d');
    
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const ui = document.getElementById('ui');
    const expFill = document.getElementById('exp-fill');
    const lvText = document.getElementById('lv-text');
    const bladeText = document.getElementById('blade-text');
    const screenMsg = document.getElementById('screen-msg');
    const msgContent = document.getElementById('msg-content');
    const bossUI = document.getElementById('boss-ui');
    const bossFill = document.getElementById('boss-fill');
    const messageLog = document.getElementById('message-log');

    let w, h;
    let gameState = 'start'; // start, playing, boss, won, lost
    const camera = { x: 0, y: 0 };
    let frameTime = 0; 
    let confettiAnimId;
    let confettis = [];
    
    const player = { x: 2000, y: 2000, r: 25, speed: 6.5, level: 1, exp: 0, nextExp: 100, blades: 3, maxBlades: 3, bladeAngle: 0, regen: 0 };
    let enemies = [], rivals = [], gems = [], particles = [], boss = null;

    let joy = { active: false, sx: 0, sy: 0, nx: 0, ny: 0 };
    let keys = {};

    function resize() { 
        w = canvas.width = confettiCanvas.width = window.innerWidth || 800; 
        h = canvas.height = confettiCanvas.height = window.innerHeight || 600; 
    }
    window.addEventListener('resize', resize);
    resize();

    // 入力イベント登録
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function handleInputStart(x, y, target) {
        if(target && (target.closest('#screen-msg') || target.closest('#start-screen'))) return; 
        if(gameState !== 'playing' && gameState !== 'boss') return;
        joy.active = true; joy.sx = x; joy.sy = y;
        const jb = document.getElementById('joy-base');
        jb.style.display = 'block'; jb.style.left = joy.sx + 'px'; jb.style.top = joy.sy + 'px';
        document.getElementById('joy-stick').style.transform = `translate(0px, 0px)`;
    }

    function handleInputMove(x, y) {
        if(!joy.active) return;
        const dx = x - joy.sx, dy = y - joy.sy;
        const dist = Math.hypot(dx, dy), max = 45, ang = Math.atan2(dy, dx), move = Math.min(dist, max);
        joy.nx = Math.cos(ang) * (move / max); joy.ny = Math.sin(ang) * (move / max);
        document.getElementById('joy-stick').style.transform = `translate(${Math.cos(ang)*move}px, ${Math.sin(ang)*move}px)`;
    }

    function handleInputEnd() {
        joy.active = false; joy.nx = 0; joy.ny = 0; 
        document.getElementById('joy-base').style.display = 'none'; 
    }

    window.addEventListener('touchstart', e => handleInputStart(e.touches[0].clientX, e.touches[0].clientY, e.target), {passive: false});
    window.addEventListener('touchmove', e => { if(joy.active) e.preventDefault(); handleInputMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
    window.addEventListener('touchend', () => handleInputEnd());

    window.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY, e.target));
    window.addEventListener('mousemove', e => { if(joy.active) e.preventDefault(); handleInputMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => handleInputEnd());
    window.addEventListener('mouseleave', () => handleInputEnd());

    // メッセージ表示
    function showMsg(txt) {
        messageLog.innerText = txt;
        setTimeout(() => { if(messageLog.innerText === txt) messageLog.innerText = ''; }, 2000);
    }

    // ゲーム開始＆リセット関数
    function startGame() {
        gameState = 'playing';
        startScreen.style.display = 'none';
        ui.style.display = 'block';
        screenMsg.style.display = 'none'; 
        bossUI.style.display = 'none';
        
        player.x = 2000; player.y = 2000; player.level = 1; player.exp = 0; player.nextExp = 100; 
        player.blades = 3; player.maxBlades = 3; player.bladeAngle = 0; player.regen = 0;
        
        enemies = []; rivals = []; gems = []; particles = []; boss = null;
        
        lvText.innerText = player.level; bladeText.innerText = player.blades; expFill.style.width = '0%';
        joy.active = false; joy.nx = 0; joy.ny = 0; document.getElementById('joy-base').style.display = 'none';
        for(let k in keys) keys[k] = false;

        if(confettiAnimId) cancelAnimationFrame(confettiAnimId);
        cCtx.clearRect(0, 0, w, h);
        confettis = [];

        showMsg("GAME START!");
    }

    // スタートボタンにイベントを直接紐付け
    startBtn.addEventListener("click", startGame);

    // 敵スポーン
    function spawnEnemy(type='normal') {
        if(enemies.length > 60) return;
        const ang = Math.random() * Math.PI * 2, dist = 800;
        enemies.push({ x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist, r: type === 'normal' ? 20 : 28, hp: type === 'normal' ? 1 : 10, speed: type === 'normal' ? 2.8 : 4.5, type: type });
    }

    function spawnRival() {
        if(rivals.length > 3) return;
        const ang = Math.random() * Math.PI * 2, dist = 900;
        rivals.push({ x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist, r: 28, speed: 4.2, blades: 4, angle: 0 });
    }

    function spawnBoss() {
        gameState = 'boss';
        boss = { x: player.x, y: player.y - 600, r: 80, hp: 100, max: 100, blades: 16, angle: 0 };
        bossUI.style.display = 'block'; bossFill.style.width = '100%';
        showMsg("！！！ 最終ボス出現 ！！！");
    }

    // 更新ロジック
    function update() {
        if(gameState !== 'playing' && gameState !== 'boss') return;

        let vx = 0, vy = 0;
        if(keys.KeyW || keys.ArrowUp) vy -= 1; if(keys.KeyS || keys.ArrowDown) vy += 1;
        if(keys.KeyA || keys.ArrowLeft) vx -= 1; if(keys.KeyD || keys.ArrowRight) vx += 1;
        if(joy.active) { vx = joy.nx; vy = joy.ny; }

        if(vx !== 0 || vy !== 0) {
            const m = Math.hypot(vx, vy);
            player.x += (vx/m) * player.speed; player.y += (vy/m) * player.speed;
        }

        camera.x = player.x - w/2; camera.y = player.y - h/2;
        player.bladeAngle += 0.08;

        if(player.blades < player.maxBlades) {
            player.regen++;
            if(player.regen > 150) { player.blades++; player.regen = 0; showMsg("刃が回復した"); }
        }

        for(let i=enemies.length-1; i>=0; i--) {
            const e = enemies[i]; const d = Math.hypot(player.x-e.x, player.y-e.y);
            e.x += (player.x-e.x)/d * e.speed; e.y += (player.y-e.y)/d * e.speed;
            let hit = false;
            for(let j=0; j<player.blades; j++) {
                const a = player.bladeAngle + (j * Math.PI*2/player.blades);
                if(Math.hypot(player.x+Math.cos(a)*110 - e.x, player.y+Math.sin(a)*110 - e.y) < e.r + 25) { hit = true; break; }
            }
            if(hit) {
                gems.push({x:e.x, y:e.y, exp:15});
                for(let p=0;p<3;p++) particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:20, c:'#22c55e'});
                enemies.splice(i,1);
            } else if(d < player.r + e.r && player.blades <= 0) {
                endGame('lost', '刃を失い、敵の群れに飲まれた...');
            }
        }

        for(let i=rivals.length-1; i>=0; i--) {
            const r = rivals[i]; const d = Math.hypot(player.x-r.x, player.y-r.y);
            r.x += (player.x-r.x)/d * r.speed; r.y += (player.y-r.y)/d * r.speed; r.angle -= 0.07;
            let cl = false;
            for(let pj=0; pj<player.blades; pj++) {
                const pa = player.bladeAngle + (pj*Math.PI*2/player.blades);
                const pbx = player.x+Math.cos(pa)*110, pby = player.y+Math.sin(pa)*110;
                for(let rj=0; rj<r.blades; rj++) {
                    const ra = r.angle + (rj*Math.PI*2/r.blades);
                    const rbx = r.x+Math.cos(ra)*110, rby = r.y+Math.sin(ra)*110;
                    if(Math.hypot(pbx - rbx, pby - rby) < 35) {
                        player.blades--; r.blades--; cl = true;
                        for(let p=0;p<5;p++) particles.push({x:(pbx+rbx)/2, y:(pby+rby)/2, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, life:30, c:'#fff'});
                        break;
                    }
                }
                if(cl) break;
            }
            for(let rj=0; rj<r.blades; rj++) {
                const ra = r.angle + (rj*Math.PI*2/r.blades);
                if(Math.hypot(r.x+Math.cos(ra)*110 - player.x, r.y+Math.sin(ra)*110 - player.y) < player.r+15) endGame('lost', 'ライバルの凶刃に倒れた...');
            }
            for(let pj=0; pj<player.blades; pj++) {
                const pa = player.bladeAngle + (pj*Math.PI*2/player.blades);
                if(Math.hypot(player.x+Math.cos(pa)*110 - r.x, player.y+Math.sin(pa)*110 - r.y) < r.r+15) {
                    for(let k=0; k<20; k++) gems.push({x:r.x+(Math.random()-0.5)*120, y:r.y+(Math.random()-0.5)*120, exp:50, gold:true});
                    for(let p=0;p<10;p++) particles.push({x:r.x, y:r.y, vx:(Math.random()-0.5)*20, vy:(Math.random()-0.5)*20, life:40, c:'#ef4444'});
                    rivals.splice(i,1); showMsg("RIVAL DEFEATED!"); break;
                }
            }
        }

        if(boss) {
            const d = Math.hypot(player.x-boss.x, player.y-boss.y);
            boss.x += (player.x-boss.x)/d * 2.5; boss.y += (player.y-boss.y)/d * 2.5; boss.angle += 0.05;
            for(let bj=0; bj<boss.blades; bj++) {
                const ba = boss.angle + (bj*Math.PI*2/boss.blades);
                if(Math.hypot(boss.x+Math.cos(ba)*180 - player.x, boss.y+Math.sin(ba)*180 - player.y) < player.r+15) endGame('lost', '魔王の圧倒的な力に砕かれた...');
            }
            for(let pj=0; pj<player.blades; pj++) {
                const pa = player.bladeAngle + (pj*Math.PI*2/player.blades);
                const pbx = player.x+Math.cos(pa)*110, pby = player.y+Math.sin(pa)*110;
                if(Math.hypot(pbx - boss.x, pby - boss.y) < boss.r+20) {
                    boss.hp -= 0.3; bossFill.style.width = (boss.hp/boss.max*100) + '%';
                    particles.push({x:pbx, y:pby, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:15, c:'#fbbf24'});
                }
            }
            if(boss.hp <= 0) endGame('won');
        }

        for(let i=gems.length-1; i>=0; i--) {
            const g = gems[i]; const d = Math.hypot(player.x-g.x, player.y-g.y);
            if(d < 250) { g.x += (player.x-g.x)/d*18; g.y += (player.y-g.y)/d*18; }
            if(d < player.r+10) {
                player.exp += g.exp; gems.splice(i,1);
                if(player.exp >= player.nextExp) {
                    player.level++; player.exp=0; player.nextExp *= 1.35;
                    player.maxBlades++; player.blades = player.maxBlades;
                    showMsg("LEVEL UP! 刃の最大数増加！");
                    if(player.level === 20) spawnBoss();
                }
            }
        }
        
        for(let i=particles.length-1; i>=0; i--) {
            const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.life--;
            if(p.life<=0) particles.splice(i,1);
        }

        if(gameState === 'playing') {
            if(Math.random() < 0.06) spawnEnemy();
            if(player.level > 5 && Math.random() < 0.01) spawnRival();
        }

        lvText.innerText = player.level; bladeText.innerText = player.blades; expFill.style.width = (player.exp/player.nextExp*100) + '%';
    }

    // 終了処理
    function endGame(res, reason='') {
        gameState = res;
        screenMsg.style.display = 'block';

        const supportUrl = "https://oshipay.streamlit.app/?page=support&user=a81f2ae1-f7c8-4aef-9430-5e8dea2bfb56&name=あさぎり&icon=💻&acct=acct_1T6prLJxxP0VtABn";
        const createUrl = "https://oshipay.streamlit.app";
        const fallbackQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(supportUrl)}`;

        if(res === 'lost') {
            msgContent.innerHTML = `
                <h1 style="font-size:36px; font-weight:900; color:#ef4444; margin-bottom:10px;">GAME OVER</h1>
                <p style="color:#cbd5e1; margin-bottom:30px; font-weight:bold;">${reason}</p>
                <button id="retry-btn" class="interactive-link" style="width:100%; padding:15px; border-radius:30px; font-weight:900; font-size:20px; color:white; background:linear-gradient(90deg, #dc2626, #991b1b); border:none; cursor:pointer;">RETRY</button>
            `;
            document.getElementById('retry-btn').addEventListener('click', startGame);
        } else {
            msgContent.innerHTML = `
                <h1 style="font-size:36px; font-weight:900; color:#facc15; margin-bottom:10px; text-shadow:0 0 10px rgba(250,204,21,0.8);">GAME CLEARED!</h1>
                <p style="color:#e2e8f0; margin-bottom:20px; font-weight:bold;">見事、魔王を討ち果たした！</p>
                <div style="background:rgba(255,255,255,0.1); padding:20px; border-radius:16px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.2);">
                    <p style="color:white; font-weight:900; font-size:24px; margin-bottom:15px;">OshiPayの応援宜しく！🔥</p>
                    
                    <a href="${supportUrl}" target="_blank" rel="noopener noreferrer" class="interactive-link" style="-webkit-touch-callout: default; display:inline-block; transition:transform 0.2s;">
                        <img src="image.png" onerror="this.onerror=null; this.src='${fallbackQrUrl}';" alt="OshiPay QR Code" style="width:180px; height:180px; border:4px solid white; border-radius:12px; background:white; object-fit:contain;">
                    </a>
                    
                    <p style="font-size:12px; color:#fde047; margin-top:10px; font-weight:bold;">↑ 画像をタップ、または長押しで応援ページへ ↑</p>
                    
                    <div style="margin-top:15px; padding-top:15px; border-top:1px solid rgba(255,255,255,0.2);">
                        <a href="${createUrl}" target="_blank" rel="noopener noreferrer" class="interactive-link" style="color:#93c5fd; font-weight:bold; text-decoration:underline; font-size:14px;">QRコード作成はこちら ▶︎</a>
                    </div>
                </div>
                <button id="replay-btn" class="interactive-link" style="width:100%; padding:15px; border-radius:30px; font-weight:900; font-size:20px; color:white; background:linear-gradient(90deg, #3b82f6, #4f46e5); border:none; cursor:pointer;">PLAY AGAIN</button>
            `;
            document.getElementById('replay-btn').addEventListener('click', startGame);
            startConfetti();
        }
    }

    // 紙吹雪アニメ
    function startConfetti() {
        const colors = ['#fce7f3', '#fbcfe8', '#fecdd3', '#fde047', '#fef08a', '#bae6fd', '#a7f3d0'];
        for(let i=0; i<150; i++) {
            confettis.push({ x: Math.random() * w, y: Math.random() * h - h, w: Math.random() * 10 + 5, h: Math.random() * 10 + 5, color: colors[Math.floor(Math.random() * colors.length)], vy: Math.random() * 3 + 2, vx: Math.random() * 2 - 1, rot: Math.random() * 360, rotSpeed: Math.random() * 10 - 5 });
        }
        function renderConfetti() {
            cCtx.clearRect(0, 0, w, h);
            confettis.forEach(c => {
                c.y += c.vy; c.x += c.vx; c.rot += c.rotSpeed;
                if(c.y > h) { c.y = -10; c.x = Math.random() * w; }
                cCtx.save(); cCtx.translate(c.x, c.y); cCtx.rotate(c.rot * Math.PI / 180);
                cCtx.fillStyle = c.color; cCtx.fillRect(-c.w/2, -c.h/2, c.w, c.h); cCtx.restore();
            });
            confettiAnimId = requestAnimationFrame(renderConfetti);
        }
        renderConfetti();
    }

    // --- キャラ描画 ---
    function drawChar(x, y, r, type, bld, ang) {
        const sx = x - camera.x, sy = y - camera.y;
        if(sx < -250 || sx > w+250 || sy < -250 || sy > h+250) return;
        const breath = Math.sin(frameTime * 0.1 + x) * 3;
        ctx.save(); ctx.translate(sx, sy + breath);

        if(type === 'player') {
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.ellipse(-12, -8, 10, 18, Math.PI/6 + Math.sin(frameTime*0.1)*0.2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(-15, 20); ctx.lineTo(15, 20); ctx.lineTo(10, -10); ctx.lineTo(-10, -10); ctx.fill();
            ctx.fillStyle = '#991b1b'; ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(15, 20); ctx.lineTo(10, 20); ctx.fill();
            ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(0, -14, 13, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(0, -18, 14, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.moveTo(-14, -18); ctx.lineTo(14, -18); ctx.lineTo(5, -8); ctx.lineTo(0, -14); ctx.lineTo(-8, -8); ctx.fill();
            ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.ellipse(-5, -14, 2.5, 4.5, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(5, -14, 2.5, 4.5, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-5.5, -15, 1.2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4.5, -15, 1.2, 0, Math.PI*2); ctx.fill();
        } else if(type === 'boss') {
            ctx.fillStyle = '#4c1d95'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, r + 10 + Math.sin(frameTime*0.15)*8, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = '#fca5a5'; ctx.beginPath(); ctx.moveTo(-30, -r+15); ctx.lineTo(-60, -r-40); ctx.lineTo(-10, -r+5); ctx.fill(); ctx.beginPath(); ctx.moveTo(30, -r+15); ctx.lineTo(60, -r-40); ctx.lineTo(10, -r+5); ctx.fill();
            ctx.shadowBlur = 25; ctx.shadowColor = '#fbbf24'; ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.ellipse(-25, -20, 12, 5, Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(25, -20, 12, 5, -Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 20, 30, 0, Math.PI, false); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-20, 20); ctx.lineTo(-12, 40); ctx.lineTo(-4, 20); ctx.fill(); ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(12, 40); ctx.lineTo(4, 20); ctx.fill();
        } else if(type === 'rival') {
            ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, 5, 22, 0, Math.PI*2); ctx.fill(); ctx.fillRect(-22, 5, 44, 20);
            ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, -12, 16, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 15; ctx.shadowColor = '#ef4444'; ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.ellipse(-6, -12, 4, 1.5, Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(6, -12, 4, 1.5, -Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(0, -12, 13, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(15, 0); ctx.lineTo(12, 25); ctx.lineTo(-12, 25); ctx.fill();
            ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(0, 12); ctx.fill();
            ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(-2, 2); ctx.lineTo(2, 2); ctx.lineTo(3, 16); ctx.lineTo(0, 19); ctx.lineTo(-3, 16); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, -14, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(5, -14, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-5, -14, 1.5, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(5, -14, 1.5, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();

        const color = type === 'player' ? '#06b6d4' : (type === 'boss' ? '#dc2626' : '#e11d48');
        const glowColor = type === 'player' ? '#22d3ee' : (type === 'boss' ? '#ef4444' : '#f43f5e');
        const dist = type === 'boss' ? 180 : 110;

        for(let i=0; i<bld; i++) {
            const a = ang + (i*Math.PI*2/bld);
            const bx = x + Math.cos(a)*dist - camera.x, by = y + Math.sin(a)*dist - camera.y;
            ctx.save(); ctx.translate(bx, by); ctx.rotate(a + Math.PI/2);
            ctx.beginPath(); ctx.arc(0, 0, 22, 0.1*Math.PI, 0.9*Math.PI); ctx.arc(0, 12, 28, 0.8*Math.PI, 0.2*Math.PI, true); ctx.closePath();
            ctx.fillStyle = color; ctx.shadowBlur = 20; ctx.shadowColor = glowColor; ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(0, 2, 14, 0.2*Math.PI, 0.8*Math.PI); ctx.arc(0, 10, 20, 0.7*Math.PI, 0.3*Math.PI, true); ctx.closePath(); ctx.fill();
            ctx.restore();
        }
    }

    // メイン描画ループ
    function loop() {
        frameTime++;
        ctx.fillStyle = '#020617'; ctx.fillRect(0,0,w,h);
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
        
        let offsetX = -(camera.x % 120); if (offsetX > 0) offsetX -= 120;
        let offsetY = -(camera.y % 120); if (offsetY > 0) offsetY -= 120;
        for(let x = offsetX; x < w; x+=120) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
        for(let y = offsetY; y < h; y+=120) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
        
        if (gameState === 'start') {
            camera.x = player.x - w/2; camera.y = player.y - h/2;
            player.bladeAngle += 0.02;
            drawChar(player.x, player.y, player.r, 'player', player.blades, player.bladeAngle);
        } else {
            gems.forEach(g => { ctx.fillStyle = g.gold ? '#fbbf24' : '#38bdf8'; ctx.beginPath(); ctx.arc(g.x-camera.x, g.y-camera.y, g.gold?8:4, 0, Math.PI*2); ctx.fill(); if(g.gold) { ctx.shadowBlur=15; ctx.shadowColor='#fbbf24'; ctx.fill(); ctx.shadowBlur=0; } });
            particles.forEach(p => { ctx.fillStyle = p.c; ctx.fillRect(p.x-camera.x, p.y-camera.y, 4, 4); });
            
            enemies.forEach(e => drawChar(e.x, e.y, e.r, e.type, 0, 0));
            rivals.forEach(r => drawChar(r.x, r.y, r.r, 'rival', r.blades, r.angle));
            
            if(gameState === 'won') {
                ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 15; ctx.shadowColor = '#fbbf24';
                for(let i=0; i<25; i++) {
                    let gx = player.x + Math.cos(i*0.5 + frameTime*0.01) * (200 + Math.sin(i*2)*80);
                    let gy = player.y + Math.sin(i*0.5 + frameTime*0.01) * (200 + Math.cos(i*2)*80);
                    ctx.beginPath(); ctx.arc(gx - camera.x, gy - camera.y, 8, 0, Math.PI*2); ctx.fill();
                }
                ctx.shadowBlur = 0;
                player.bladeAngle -= 0.11; 
            } else if(boss) {
                drawChar(boss.x, boss.y, boss.r, 'boss', boss.blades, boss.angle);
            }
            
            drawChar(player.x, player.y, player.r, 'player', player.blades, player.bladeAngle);
            update(); 
        }

        requestAnimationFrame(loop);
    }
    
    // ループ開始
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
